apiVersion: v2
name: tenant-migrations
description: What the parent's PreSync hook Application deploys on the tenant cluster - each migrating service's OWN chart in migrationsOnly mode, so the Job template lives with the service that owns the schema and this chart owns nothing but the selection and the waves
type: application
version: 0.1.0
dependencies:
  - name: fake-service
    version: 0.1.0
    repository: file://../fake-service
    alias: backend
    condition: backend.enabled
  - name: fake-service
    version: 0.1.0
    repository: file://../fake-service
    alias: subgraph-a
    condition: subgraph-a.enabled
  - name: fake-service
    version: 0.1.0
    repository: file://../fake-service
    alias: subgraph-b
    condition: subgraph-b.enabled
