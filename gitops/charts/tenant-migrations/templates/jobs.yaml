{{- /*
Plain resources, deliberately NOT hooks: these Jobs are what the hook
Application manages, so ArgoCD's built-in Job health drives the parent's gate —
Progressing while migrating, Healthy on success, Degraded on failure. Make them
hooks and the app manages nothing, reports Synced/Healthy on creation and never
runs them.

A Job spec is immutable, so the name carries a hash of everything that shapes
the spec: any change is a fresh Job (a create), never an in-place mutation.
(Replace=true was tried and fails — the API server adds spec.selector at create
time and both it and the template are immutable.)
*/ -}}
{{- $counts := dict -}}
{{- range .Values.services -}}
{{- $_ := set $counts .db (add (get $counts .db | default 0) 1) -}}
{{- end -}}
{{- $seen := dict -}}
{{- $releaseId := .Values.releaseId -}}
{{- range $svc := .Values.services }}
{{- $name := $svc.name -}}
{{- $db := $svc.db -}}
{{- $wave := 0 -}}
{{- if gt (int (get $counts $db)) 1 -}}
{{- $wave = int (get $seen $db | default 0) -}}
{{- $_ := set $seen $db (add $wave 1) -}}
{{- end }}
{{- $fingerprint := printf "%s|%s|%s|%s|%s|%s|%s:%s" $name $releaseId $svc.version $db ($svc.sleepSeconds | default 2 | toString) ($svc.fail | default false | toString) $.Values.image.repository $.Values.image.tag }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-{{ $name }}-{{ $releaseId }}-{{ $fingerprint | sha256sum | trunc 8 }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: tenant-migrations
    service: {{ $name | quote }}
    release-id: {{ $releaseId | quote }}
    job-role: migration
  annotations:
    argocd.argoproj.io/sync-wave: {{ $wave | quote }}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenant-migrations
        service: {{ $name | quote }}
        release-id: {{ $releaseId | quote }}
        job-role: migration
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          env:
            - name: PGHOST
              value: {{ $.Values.db.host | quote }}
            - name: PGPORT
              value: {{ $.Values.db.port | quote }}
            - name: PGDATABASE
              value: {{ $db | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.db.secretName }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.db.secretName }}
                  key: password
            - name: SLEEP_SECONDS
              value: {{ $svc.sleepSeconds | default 2 | quote }}
            - name: FAIL
              value: {{ $svc.fail | default false | quote }}
            - name: SVC_NAME
              value: {{ $name | quote }}
            - name: VERSION
              value: {{ $svc.version | quote }}
            - name: RELEASE_ID
              value: {{ $releaseId | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              TABLE="schema_version_$(echo "${SVC_NAME}" | tr '-' '_')"
              i=0; until pg_isready -q; do i=$((i+2)); [ "$i" -ge 120 ] && { echo "db not ready after 120s"; exit 1; }; sleep 2; done
              echo "migrate[${SVC_NAME}] release=${RELEASE_ID} version=${VERSION} db=${PGDATABASE} sleep=${SLEEP_SECONDS} fail=${FAIL}"
              psql -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS ${TABLE}(version text, applied_at timestamptz DEFAULT now());"
              psql -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS migration_log(svc text, release_id text, version text, started_at timestamptz, finished_at timestamptz);"
              psql -v ON_ERROR_STOP=1 -c "INSERT INTO ${TABLE}(version) VALUES ('${VERSION}');"
              psql -v ON_ERROR_STOP=1 -c "INSERT INTO migration_log(svc, release_id, version, started_at) VALUES ('${SVC_NAME}', '${RELEASE_ID}', '${VERSION}', now());"
              psql -v ON_ERROR_STOP=1 -c "SELECT pg_sleep(${SLEEP_SECONDS});"
              if [ "${FAIL}" = "true" ]; then
                echo "migrate[${SVC_NAME}]: FAIL=true, exiting 1 (ledger row left unfinished)"
                exit 1
              fi
              psql -v ON_ERROR_STOP=1 -c "UPDATE migration_log SET finished_at = now() WHERE svc='${SVC_NAME}' AND release_id='${RELEASE_ID}' AND finished_at IS NULL;"
              echo "migrate[${SVC_NAME}]: done"
{{- end }}
