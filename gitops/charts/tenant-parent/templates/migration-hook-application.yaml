{{- /*
The tenant's migrations, as a PreSync hook *Application* rather than a Job.
A Job cannot be used here: hooks are resources of the parent, so they land on
the parent's destination (the control cluster, where the Application CRs must
live) — not on the cluster where the tenant actually runs. An Application can
carry its own destination, so it is the only shape that reaches the tenant.
The parent's PreSync phase completes only when this app reports Healthy, which
depends on the Application health customization in bootstrap/argocd-cm-patch.yaml.
*/ -}}
{{- $svcs := list "backend" "subgraph-a" "subgraph-b" -}}
{{- $parsed := dict -}}
{{- range $name := $svcs -}}{{- $_ := set $parsed $name ((index $.Values.tenantFiles $name | default "") | fromYaml) -}}{{- end -}}
{{- $releaseId := (get (get $parsed "backend") "releaseId") | default "r0" -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-migrations-{{ .Values.tenant }}
  namespace: argocd
  labels:
    app.kubernetes.io/name: tenant-migrations
    tenant: {{ .Values.tenant | quote }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
  # deliberately NO resources-finalizer: BeforeHookCreation deletes this object
  # on every parent sync, and a finalizer would cascade into the migration Job.
spec:
  project: default
  sources:
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.targetRevision }}
      path: gitops/charts/tenant-migrations
      helm:
        values: |
          releaseId: {{ $releaseId }}
          services:
          {{- range $name := $svcs }}
          {{- $cfg := get $parsed $name }}
          {{- $db := "main" }}{{ if eq $name "subgraph-b" }}{{ $db = "subgraph_b" }}{{ end }}
            - name: {{ $name }}
              db: {{ $db }}
              version: {{ get $cfg "version" }}
              sleepSeconds: {{ (get $cfg "migrations") | default dict | dig "sleepSeconds" 2 }}
              fail: {{ (get $cfg "migrations") | default dict | dig "fail" false }}
          {{- end }}
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.targetRevision }}
      ref: values
  destination:
    name: {{ .Values.childCluster }}
    namespace: {{ .Values.namespace }}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
    retry:
      limit: 0
