{{- if eq (.Values.mode | default "parent") "probe" }}
{{- /*
Experiment only (mode=probe): a PreSync Job carrying an explicit namespace,
rendered by an Application whose destination is a DIFFERENT cluster than where
that namespace's workloads live. It exists to answer, empirically, whether a
hook Job can reach the tenant's cluster from a parent that lives on the ArgoCD
cluster. See README "Can the Job be a direct hook of the parent?".
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: probe-hook
  namespace: {{ .Values.probeNamespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: probe
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/bin/sh", "-c", "echo probe ran on $(hostname); sleep 2"]
---
# Non-hook resource: without one the Application has nothing to compare, reports
# Synced/Healthy immediately and never runs a sync — so the hook above never fires.
# (That is itself one of this lab's findings; here it just makes the probe run.)
apiVersion: v1
kind: ConfigMap
metadata:
  name: probe-state
  namespace: {{ .Release.Namespace }}
data:
  probe: {{ .Values.probeNamespace | quote }}
{{- end }}
