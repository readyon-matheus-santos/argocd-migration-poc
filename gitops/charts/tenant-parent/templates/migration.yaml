{{- /*
The tenant's migrations, as the parent's ONE PreSync hook: an Application whose
destination is the tenant cluster and whose source is the tenant-migrations
wrapper chart. It has to be an Application and not a Job: hooks are resources of
the parent and land on the parent's destination (the control cluster, where
Application CRs live), never on the tenant cluster. An Application carries its
own destination, so it is the only shape that reaches the tenant.

The parent's PreSync completes only when this app reports Healthy, which needs
the Application health customization in bootstrap/argocd-cm-patch.yaml.

Same-database services migrate in sequence (later wave); different databases in
parallel (same wave).
*/ -}}
{{- $svcs := list "backend" "subgraph-a" "subgraph-b" -}}
{{- $dbs := dict "backend" "main" "subgraph-a" "main" "subgraph-b" "subgraph_b" -}}
{{- $parsed := dict -}}
{{- range $name := $svcs -}}{{- $_ := set $parsed $name ((index $.Values.tenantFiles $name | default "") | fromYaml) -}}{{- end -}}
{{- $releaseId := (get (get $parsed "backend") "releaseId") | default "r0" -}}
{{- $seen := dict -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-migrations-{{ .Values.tenant }}
  namespace: argocd
  labels:
    app.kubernetes.io/name: tenant-migrations
    tenant: {{ .Values.tenant | quote }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
  # deliberately NO resources-finalizer: BeforeHookCreation deletes this object
  # on every parent sync, and a finalizer would cascade into the running Jobs.
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: gitops/charts/tenant-migrations
    helm:
      values: |
        {{- range $name := $svcs }}
        {{- $cfg := get $parsed $name }}
        {{- $db := get $dbs $name }}
        {{- $wave := int (get $seen $db | default 0) }}
        {{- $_ := set $seen $db (add $wave 1) }}
        {{ $name }}:
          enabled: true
          migrationsOnly: true
          name: {{ $name }}
          db:
            name: {{ $db }}
          releaseId: {{ $releaseId }}
          version: {{ get $cfg "version" }}
          migrations:
            sleepSeconds: {{ (get $cfg "migrations") | default dict | dig "sleepSeconds" 2 }}
            fail: {{ (get $cfg "migrations") | default dict | dig "fail" false }}
            wave: {{ $wave | quote }}
        {{- end }}
  destination:
    name: {{ .Values.childCluster }}
    namespace: {{ .Values.namespace }}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
    retry:
      limit: 0
