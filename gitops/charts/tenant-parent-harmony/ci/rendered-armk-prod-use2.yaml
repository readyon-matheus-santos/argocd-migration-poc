          - $values/values/_regions/use2/build-shift-region.yaml
          - $values/values/_tenants/armk-prod/build-shift-tenant.yaml
        ignoreMissingValueFiles: true
        values: |
          aws:
            accountId: "<PROD_ACCOUNT_ID>"
            region: "us-east-2"
          environment: "prod"
          client: "armk"
          isolationMode: isolated
          env:
            ENV: "production"
            NODE_ENV: "production"
            TENANT_ID: "armk"
            # Reproduce umbrella-injected env (live-verified); shared-prod carries neither.
            AWS_S3_DOCUMENTS_BUCKET: "armk-prod-documents-us-east-2-<PROD_ACCOUNT_ID>"
            AWS_S3_SNOWFLAKE_BUCKET: "armk-prod-snowflake-us-east-2-<PROD_ACCOUNT_ID>"
            ""
            OTEL_ENDPOINT: "http://otel-collector-collector.armk-prod.svc.cluster.local:4318"
            OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "http://otel-collector-collector.armk-prod.svc.cluster.local:4318/v1/logs"
            OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "http://otel-collector-collector.armk-prod.svc.cluster.local:4318/v1/metrics"
            OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://otel-collector-collector.armk-prod.svc.cluster.local:4318/v1/traces"
            ""
          # build-shift runs PM2 (live pod = readOnlyRootFilesystem false). Set here (Layer 5,
          # after shared-prod) so the B8 baseline true doesn't clobber it.
          securityContext:
            readOnlyRootFilesystem: false
          # Per-subgraph IRSA. Own graphql-build-shift SA + dedicated role, region-
          # correct via .shortName (use2 active / usw2 standby).
          serviceAccount:
            create: true
            name: graphql-build-shift
            annotations:
              eks.amazonaws.com/role-arn: "arn:aws:iam::<PROD_ACCOUNT_ID>:role/harmony-prod-""-""-graphql-build-shift-role"
          region:
            role: ""
            replicaMultiplier: ""
          ""
          # usw2 (standby) has no live graphql pods; keep the standalone disabled there.
          enabled: false
          ""
        parameters:
    - repoURL: "https://github.com/ReadyOn-Inc/readyon-harmony.git"
      targetRevision: "main"
      ref: values
  destination:
    name: "harmony-prod-use2"
    namespace: "armk-prod"
