apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-migrations-armk-prod-use2
  namespace: argocd
  labels:
    app: tenant-migrations
    tenant: "armk"
    env: "prod"
    region: "use2"
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: "production"
  sources:
    - repoURL: "<PLATFORM_ACCOUNT_ID>.dkr.ecr.us-east-2.amazonaws.com"
      chart: readyon-helm-charts/tenant-parent
      targetRevision: "0.1.0"
      helm:
        values: |
          # same chart, migrations role
          mode: migrations
          tenant: armk-prod
          client: armk
          env: prod
          namespace: armk-prod
          isolationMode: isolated
          dbEnv: ""
          region:
            shortName: use2
            name: us-east-2
            accountId: "<PROD_ACCOUNT_ID>"
          migrations:
            from: backend
            job:
              activeDeadlineSeconds: 10800
              backoffLimit: 3
              command:
              - npm
              - run
              - db:migrate
              env:
                NODE_TLS_REJECT_UNAUTHORIZED: "0"
                TYPEORM_SSL_MODE: "true"
              externalSecretName: backend-migrations-db-secrets
              image: ""
              repository: <PROD_ACCOUNT_ID>.dkr.ecr.us-east-2.amazonaws.com/readyon-backend
              ttlSecondsAfterFinished: 300
              image: "v1.0.7-prod-20260817-235744-4105f710"
    # $values is required even though this role reads no value files today:
    # the chart's valueFiles may reference it, and a missing ref source makes the
    # app go Unknown/ComparisonError, which would hang the parent's PreSync.
    - repoURL: "https://github.com/ReadyOn-Inc/readyon-harmony.git"
      targetRevision: "main"
      ref: values
  destination:
    name: "harmony-prod-use2"
    namespace: "armk-prod"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 0
