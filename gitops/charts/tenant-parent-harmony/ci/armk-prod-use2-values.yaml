        OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "http://otel-collector-collector.armk-prod.svc.cluster.local:4318/v1/metrics"
        OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://otel-collector-collector.armk-prod.svc.cluster.local:4318/v1/traces"
      ""


  apolloRouter:
    appName: apollo-router
    chart: readyon-helm-charts/apollo-router
    targetRevision: "1.11.2"
    wave: "5"
    valueFiles:
      - $values/values/_base/apollo-router.yaml
      - $values/values/shared-prod.yaml
      - $values/values/_regions/use2/apollo-router-region.yaml
      - $values/values/_tenants/armk-prod/apollo-router-tenant.yaml
    values: |
      environment: "prod"
      client: "armk"
      isolationMode: isolated
      # Own the shared graphql-services ServiceAccount + IRSA role (WS-C).
      # Re-homed from the umbrella (which created it at wave 3) so it survives
      # the umbrella/gateway teardown without stripping the fleet's AWS identity.
      # Every graphql-fleet workload in the namespace (standalone subgraphs +
      # the umbrella's gateway) reuses it by name. Mirrors nonprod (#3824-era).
      # NB: chart creates the SA only when serviceAccountName is unset — so this
      # replaces the prior `serviceAccountName: graphql-services` reference.
      serviceAccount:
        create: true
        name: graphql-services
        annotations:
          eks.amazonaws.com/role-arn: "arn:aws:iam::<PROD_ACCOUNT_ID>:role/harmony-prod-use2-armk-prod-graphql-role"
      region:
        role: ""
        replicaMultiplier: ""
      ""
      # Route telemetry to the per-tenant OTEL collector (deployed by
      # otel-tenant-collector AppSet) which forwards to the client's
      # SignOz instance. Without this, apollo-router inherits
      # OTEL_ENDPOINT from shared-prod.yaml and lands in the
      # platform-cluster SignOz instead of signoz-{client}. Same
      # override pattern as callouts-prod and graphql-services-prod.
      env:
        OTEL_ENDPOINT: "http://otel-collector-collector.armk-prod.svc.cluster.local:4318"
        OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "http://otel-collector-collector.armk-prod.svc.cluster.local:4318/v1/logs"
        OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "http://otel-collector-collector.armk-prod.svc.cluster.local:4318/v1/metrics"
        OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://otel-collector-collector.armk-prod.svc.cluster.local:4318/v1/traces"
      ""



migrations:
  enabled: true
  retryLimit: 0
  services:
    - name: backend
