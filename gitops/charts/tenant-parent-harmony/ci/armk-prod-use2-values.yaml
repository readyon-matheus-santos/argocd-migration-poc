# Fixture: exactly what applicationsets/prod/tenant-parent.yaml passes for
# armk-prod / use2, with the generator's go-template vars resolved. The children
# blocks are the real ones copied from harmony's per-service ApplicationSets
# (account IDs redacted — this repo is public).
#
#   helm template t . -f ci/armk-prod-use2-values.yaml
tenant: armk-prod
client: armk
env: prod
environmentName: production
namespace: armk-prod
isolationMode: isolated
childProject: production
chartRepoURL: <PLATFORM_ACCOUNT_ID>.dkr.ecr.us-east-2.amazonaws.com
valuesSource:
  repoURL: https://github.com/ReadyOn-Inc/readyon-harmony.git
  targetRevision: main
  root: values
region:
  shortName: use2
  name: us-east-2
  cluster: harmony-prod-use2
  accountId: "<PROD_ACCOUNT_ID>"
  role: active
  databaseRole: primary
  replicaMultiplier: 1.0

tenantFiles:
  backend: |
    image:
      repository: readyon-backend
      tag: v1.0.7-prod-20260817-235744-4105f710
  rbac: |
    enabled: true
    image:
      tag: v1.0.7-prod-20260817-235744-4105f710

children:
  backend:
    appName: backend
    chart: readyon-helm-charts/backend
    targetRevision: "1.10.8"
    wave: "2"
    disableMigrations: true   # its migration moved to the parent's hook
    valueFiles:
      - $values/values/_base/backend.yaml
      - $values/values/shared-prod.yaml
      - $values/values/_regions/use2/backend-region.yaml
      - $values/values/_tenants/armk-prod/backend-tenant.yaml
    values: |
      aws:
        accountId: "<PROD_ACCOUNT_ID>"
        region: "us-east-2"
      # Per-app credentials templating
      environment: "prod"
      client: "armk"
      isolationMode: isolated
      env:
        # Read-only source DB name for the associateGroupId backfill
        # migration (readyon-ui #25185), run by THIS backend PreSync Job.
        # The migration opens a second, read-only connection to the
        # tenant's associates-group DB; host, port, credentials and TLS
        # are inherited from the Job's own TYPEORM_* (the AG DB and the
        # main DB sit on the same cluster in every tenant), so the
        # database NAME is the only thing it needs. It lands in the Job
        # because the backend chart merges `env` into the migration Job.
        #
        # Derived, not hardcoded per tenant: this MUST resolve to THIS
        # tenant's AG DB. The expression mirrors the associates-group
        # subgraph's own DB name (the chart's common.dbFullName, baseName
        # associates_group):
        #   shared             -> {client}_associates_group_{env}
        #   isolated/dedicated -> associates_group_{env}
        # Prod is NOT uniform: armk/hilt/mgm are isolated/dedicated and
        # get NO client prefix (associates_group_prod, _uat, _sbx), while
        # rdyn-prod is `shared` and does (rdyn_associates_group_prod).
        # common.dbFullName special-cases only "shared" — `dedicated`
        # takes the same unprefixed branch as `isolated`, so test on
        # "shared", never on the mode list.
        #
        # Anchored on `.env` alone (no dbEnv term): RAD is a nonprod-only
        # construct, no prod tenant carries `dbEnv`, and nothing under
        # values/ sets the chart's dbEnvironment — so the env axis IS the
        # database axis here.
        AG_DATABASE: '""""_""associates_group_""'
        ""
        OTEL_ENDPOINT: "http://otel-collector-collector.armk-prod.svc.cluster.local:4318"
        OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "http://otel-collector-collector.armk-prod.svc.cluster.local:4318/v1/logs"
        OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "http://otel-collector-collector.armk-prod.svc.cluster.local:4318/v1/metrics"
        OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://otel-collector-collector.armk-prod.svc.cluster.local:4318/v1/traces"
        ""
        AWS_S3_DOCUMENTS_BUCKET: "armk-prod-documents-us-east-2-<PROD_ACCOUNT_ID>"
        AWS_S3_SNOWFLAKE_BUCKET: "armk-prod-snowflake-us-east-2-<PROD_ACCOUNT_ID>"
      serviceAccount:
        create: true
        name: backend
        annotations:
          eks.amazonaws.com/role-arn: "arn:aws:iam::<PROD_ACCOUNT_ID>:role/harmony-prod-use2-armk-prod-backend-role"
      region:
        role: ""
        replicaMultiplier: ""


