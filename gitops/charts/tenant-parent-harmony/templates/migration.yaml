{{- if include "tp.migrationsActive" . }}
{{- /*
The tenant's migrations, as the parent's ONE PreSync hook: an Application whose
destination is the tenant cluster and whose source is the tenant-migrations
chart — one Job per migrating service, plain resources, sync-waves serializing
services that share a database.

Why an Application and not a Job: hooks are resources of the parent, and every
resource of an Application is applied to that Application's single
spec.destination — the platform cluster, the only place Application CRs exist. A
Job hook would run there: no tenant database, no tenant secrets, wrong AWS
account. Verified in this lab, twice. ArgoCD has no per-resource destination
(argo-cd#8944, open), so only an Application — which carries its own destination
— reaches the tenant, and it keeps the PreSync ordering exactly.

The parent's PreSync completes only when this app reports Healthy, which needs
the argocd-cm `Application` health customization (Synced+Healthy ⇒ Healthy, and
still Healthy when a stale operationState says Failed).

No resources-finalizer: BeforeHookCreation deletes this object on every parent
sync, and a finalizer would turn that into a cascade delete of the running Jobs.
*/ -}}
{{- $root := . }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-migrations-{{ .Values.tenant }}-{{ .Values.region.shortName }}
  namespace: argocd
  labels:
    app: tenant-migrations
    tenant: {{ .Values.client | quote }}
    env: {{ .Values.env | quote }}
    region: {{ .Values.region.shortName | quote }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: {{ .Values.childProject | quote }}
  source:
    repoURL: {{ .Values.chartRepoURL | quote }}
    chart: {{ .Values.migrations.chart | quote }}
    targetRevision: {{ .Values.migrations.targetRevision | quote }}
    helm:
      values: |
        tenant: {{ .Values.tenant }}
        client: {{ .Values.client }}
        env: {{ .Values.env }}
        namespace: {{ .Values.namespace }}
        services:
        {{- range $svc := .Values.migrations.services }}
        {{- $key := $svc.name }}
        {{- if not (hasKey $root.Values.children $key) }}{{ fail (printf "tenant-parent: migrations.services[%s] is not a child" $key) }}{{ end }}
        {{- $tag := include "tp.tag" (dict "root" $root "key" $key "required" true) }}
          - {{ toYaml (merge (dict "image" (dict "tag" $tag)) (deepCopy $svc)) | nindent 12 | trim }}
        {{- end }}
  destination:
    name: {{ .Values.region.cluster | quote }}
    namespace: {{ .Values.namespace | quote }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: {{ .Values.migrations.retryLimit | default 0 }}
{{- end }}
