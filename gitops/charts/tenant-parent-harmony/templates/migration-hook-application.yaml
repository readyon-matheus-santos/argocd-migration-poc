{{- if eq (.Values.mode | default "parent") "parent" }}
{{- if include "tp.migrationsActive" . }}
{{- $mig := index .Values.children .Values.migrations.from }}
{{- $tag := include "tp.tag" (dict "root" . "key" .Values.migrations.from "required" true) }}
{{- /*
The tenant's shared-DB migration, as a PreSync hook *Application*.

Why an Application and not a Job: hooks are resources of the parent, and every
resource of an Application is applied to that Application's single
spec.destination. The parent must live on the ArgoCD (platform) cluster, because
that is the only place Application CRs exist. A Job hook would therefore run on
the platform cluster — no tenant database, no tenant secrets, wrong AWS account.
Verified in this lab: a PreSync Job with an explicit tenant namespace ran on the
parent's cluster even when the same namespace existed on the workload cluster.
ArgoCD has no per-resource destination (see argo-cd#8944, still open), so
wrapping the Job in an Application — which carries its own destination — is the
only way to reach the tenant, and it keeps the PreSync ordering exactly.

The parent's PreSync completes only when this app reports Healthy, which needs
the argocd-cm `Application` health customization (Synced+Healthy ⇒ Healthy, and
importantly still Healthy when a stale operationState says Failed).

No resources-finalizer: BeforeHookCreation deletes this object on every parent
sync, and a finalizer would turn that into a cascade delete of the running Job.
*/ -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-migrations-{{ .Values.tenant }}-{{ .Values.region.shortName }}
  namespace: argocd
  labels:
    app: tenant-migrations
    tenant: {{ .Values.client | quote }}
    env: {{ .Values.env | quote }}
    region: {{ .Values.region.shortName | quote }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: {{ .Values.childProject | quote }}
  sources:
    - repoURL: {{ .Values.chartRepoURL | quote }}
      chart: readyon-helm-charts/tenant-parent
      targetRevision: {{ .Chart.Version | quote }}
      helm:
        values: |
          # same chart, migrations role
          mode: migrations
          tenant: {{ .Values.tenant }}
          client: {{ .Values.client }}
          env: {{ .Values.env }}
          namespace: {{ .Values.namespace }}
          isolationMode: {{ .Values.isolationMode }}
          dbEnv: {{ .Values.dbEnv | quote }}
          region:
            shortName: {{ .Values.region.shortName }}
            name: {{ .Values.region.name }}
            accountId: {{ .Values.region.accountId | quote }}
          migrations:
            from: {{ .Values.migrations.from }}
            job:
              {{- toYaml .Values.migrations.job | nindent 14 }}
              image: {{ $tag | quote }}
    # $values is required even though this role reads no value files today:
    # the chart's valueFiles may reference it, and a missing ref source makes the
    # app go Unknown/ComparisonError, which would hang the parent's PreSync.
    - repoURL: {{ .Values.valuesSource.repoURL | quote }}
      targetRevision: {{ .Values.valuesSource.targetRevision | quote }}
      ref: values
  destination:
    name: {{ .Values.region.cluster | quote }}
    namespace: {{ .Values.namespace | quote }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: {{ .Values.migrations.retryLimit | default 0 }}
{{- end }}
{{- end }}
