# Per-service identity comes from gitops/values/_base/<svc>.yaml; per-tenant
# release state from gitops/values/_tenants/<tenant>/<svc>.yaml.
name: ""
version: v1
releaseId: r0

image:
  repository: alpine
  tag: "3.20"

replicaCount: 1

db:
  name: main
  host: postgres
  port: 5432
  secretName: postgres-creds

# Render ONLY the migration Job, as a plain (non-hook) resource named per
# release. Set by the tenant-migrations wrapper chart, which runs inside the
# parent's PreSync hook Application on the tenant cluster. Never set it in a
# service's own values.
migrationsOnly: false

# Per-service PreSync migration Job owned by THIS service's Application
# (the S1 baseline shape). Off in the default profile: the tenant-migrations
# wrapper carries the Jobs instead.
migrations:
  enabled: false
  sleepSeconds: 2
  fail: false
  # migrationsOnly: sync-wave inside the migrations app (same DB => later wave)
  wave: "0"
  image:
    repository: postgres
    tag: "16"


progressDeadlineSeconds: 600

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi
