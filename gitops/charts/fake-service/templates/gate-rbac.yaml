{{- if .Values.gate.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "fake-service.name" . }}-gate-reader
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["migrations-complete"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "fake-service.name" . }}-gate-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "fake-service.name" . }}-gate-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "fake-service.name" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
