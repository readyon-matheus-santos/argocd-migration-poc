{{- if or .Values.migrationsOnly .Values.migrations.enabled }}
{{- $name := include "fake-service.name" . }}
{{- /*
Two shapes from one template:

  migrationsOnly=false (harmony today / S1): the service's own PreSync hook,
  BeforeHookCreation, fixed name. Runs on every sync of the service app.

  migrationsOnly=true (the design): a PLAIN resource rendered by the
  tenant-migrations wrapper chart, inside the parent's PreSync hook Application.
  Plain rather than a hook because an app whose contents are all hooks manages
  nothing — it reports Synced/Healthy on creation and never runs them. As a
  managed resource the Job's own health gates the parent.

  A Job spec is immutable, so the name carries a hash of everything that shapes
  the spec: any change is a fresh Job (a create), never an in-place mutation —
  which is what Replace=true tried and failed to do (selector/template are
  immutable and the API server adds the selector itself).
*/ -}}
{{- $fingerprint := printf "%s|%s|%s|%s|%s|%s|%s:%s" $name .Values.releaseId .Values.version .Values.db.name (.Values.migrations.sleepSeconds | toString) (.Values.migrations.fail | toString) .Values.migrations.image.repository .Values.migrations.image.tag }}
{{- $jobName := printf "%s-migrate" $name }}
{{- if .Values.migrationsOnly }}
{{- $jobName = printf "%s-migrate-%s-%s" $name .Values.releaseId ($fingerprint | sha256sum | trunc 8) }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $jobName }}
  labels:
    {{- include "fake-service.labels" . | nindent 4 }}
    job-role: migration
  annotations:
    {{- if .Values.migrationsOnly }}
    argocd.argoproj.io/sync-wave: {{ .Values.migrations.wave | default "0" | quote }}
    {{- else }}
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    {{- end }}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "fake-service.labels" . | nindent 8 }}
        job-role: migration
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.migrations.image.repository }}:{{ .Values.migrations.image.tag }}"
          env:
            - name: PGHOST
              value: {{ .Values.db.host | quote }}
            - name: PGPORT
              value: {{ .Values.db.port | quote }}
            - name: PGDATABASE
              value: {{ .Values.db.name | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.secretName }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.secretName }}
                  key: password
            - name: SLEEP_SECONDS
              value: {{ .Values.migrations.sleepSeconds | quote }}
            - name: FAIL
              value: {{ .Values.migrations.fail | quote }}
            - name: SVC_NAME
              value: {{ $name | quote }}
            - name: VERSION
              value: {{ .Values.version | quote }}
            - name: RELEASE_ID
              value: {{ .Values.releaseId | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              TABLE="schema_version_$(echo "${SVC_NAME}" | tr '-' '_')"
              i=0; until pg_isready -q; do i=$((i+2)); [ "$i" -ge 120 ] && { echo "db not ready after 120s"; exit 1; }; sleep 2; done
              echo "migrate[${SVC_NAME}] release=${RELEASE_ID} version=${VERSION} db=${PGDATABASE} sleep=${SLEEP_SECONDS} fail=${FAIL}"
              psql -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS ${TABLE}(version text, applied_at timestamptz DEFAULT now());"
              psql -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS migration_log(svc text, release_id text, version text, started_at timestamptz, finished_at timestamptz);"
              psql -v ON_ERROR_STOP=1 -c "INSERT INTO ${TABLE}(version) VALUES ('${VERSION}');"
              psql -v ON_ERROR_STOP=1 -c "INSERT INTO migration_log(svc, release_id, version, started_at) VALUES ('${SVC_NAME}', '${RELEASE_ID}', '${VERSION}', now());"
              psql -v ON_ERROR_STOP=1 -c "SELECT pg_sleep(${SLEEP_SECONDS});"
              if [ "${FAIL}" = "true" ]; then
                echo "migrate[${SVC_NAME}]: FAIL=true, exiting 1 (ledger row left unfinished)"
                exit 1
              fi
              psql -v ON_ERROR_STOP=1 -c "UPDATE migration_log SET finished_at = now() WHERE svc='${SVC_NAME}' AND release_id='${RELEASE_ID}' AND finished_at IS NULL;"
              echo "migrate[${SVC_NAME}]: done"
{{- end }}
