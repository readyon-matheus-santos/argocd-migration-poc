{{- /*
Plain resources, deliberately NOT hooks: these Jobs are what the hook
Application manages, so ArgoCD's built-in Job health drives the parent's gate —
Progressing while migrating, Healthy on success, Degraded on failure. Make them
hooks and the app manages nothing, reports Synced/Healthy on creation, never
syncs, and the parent proceeds with nothing migrated.

A Job spec is immutable, so the name carries a hash of everything that shapes
the spec: a tag bump or a migration-only edit (A7 TLS toggles, backoffLimit) is
a fresh Job — a create, never an in-place mutation. Replace=true was tried and
fails: the API server adds spec.selector at create time and both it and the
template are immutable.

This mirrors charts/backend/templates/migration-job.yaml as it runs today
(backoffLimit/activeDeadlineSeconds/TTL, the migrations-only TLS env from rule
A7, direct-to-Aurora rather than through pgBouncer).
*/ -}}
{{- $counts := dict -}}
{{- range .Values.services -}}
{{- $_ := set $counts .db (add (get $counts .db | default 0) 1) -}}
{{- end -}}
{{- $seen := dict -}}
{{- range $svc := .Values.services }}
{{- $name := required "tenant-migrations: services[].name is required" $svc.name -}}
{{- $db := required (printf "tenant-migrations: services[%s].db is required" $name) $svc.db -}}
{{- $tag := required (printf "tenant-migrations: services[%s].image.tag is required" $name) (($svc.image | default dict).tag) -}}
{{- $wave := 0 -}}
{{- if gt (int (get $counts $db)) 1 -}}
{{- $wave = int (get $seen $db | default 0) -}}
{{- $_ := set $seen $db (add $wave 1) -}}
{{- end }}
{{- $fingerprint := dict "name" $name "db" $db "image" $svc.image "command" $svc.command "env" $svc.env "secret" $svc.externalSecretName "backoffLimit" $svc.backoffLimit "activeDeadlineSeconds" $svc.activeDeadlineSeconds | toJson | sha256sum | trunc 8 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-migrations-%s" $name $fingerprint }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}-migrations
    app.kubernetes.io/component: migrations
    app.kubernetes.io/part-of: tenant-migrations
    tenant: {{ $.Values.client | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $wave | quote }}
spec:
  backoffLimit: {{ $svc.backoffLimit | default 3 }}
  activeDeadlineSeconds: {{ $svc.activeDeadlineSeconds | default 10800 }}
  ttlSecondsAfterFinished: {{ $svc.ttlSecondsAfterFinished | default 300 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}-migrations
        app.kubernetes.io/component: migrations
        app.kubernetes.io/part-of: tenant-migrations
    spec:
      restartPolicy: Never
      containers:
        - name: migrations
          image: "{{ $svc.image.repository }}:{{ $tag }}"
          command: {{ toYaml ($svc.command | default (list "npm" "run" "db:migrate")) | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ $svc.externalSecretName | default (printf "%s-migrations-db-secrets" $name) }}
          env:
            {{- range $k, $v := ($svc.env | default dict) }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
{{- end }}
