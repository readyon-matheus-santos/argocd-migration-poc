# Passed by the parent's hook Application (tenant-parent-harmony/templates/migration.yaml);
# nothing here is read from value layers.
tenant: ""            # armk-prod
client: ""            # armk
env: ""               # prod
namespace: ""         # armk-prod

# One entry per migrating service. This chart is the ONE place a parent-managed
# tenant's migration Job is defined: once every tenant is on the parent, the
# service chart's own PreSync Job template is dead code and can be removed.
# Services sharing a `db` are serialized by sync-wave in list order; different
# databases migrate in parallel.
