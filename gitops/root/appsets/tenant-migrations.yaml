apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-migrations
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: __REPO_URL__
        revision: __TARGET_REVISION__
        files:
          - path: gitops/tenants.yaml
  template:
    metadata:
      name: "tenant-migrations-{{ .tenant }}"
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: default
      sources:
        - repoURL: __REPO_URL__
          targetRevision: __TARGET_REVISION__
          path: gitops/charts/tenant-migrations
          helm:
            valueFiles:
              - $values/gitops/values/_base/tenant-migrations.yaml
              - $values/gitops/values/_tenants/{{ .tenant }}/tenant-migrations.yaml
            values: |
              tenant: {{ .tenant }}
              namespace: {{ .namespace }}
        - repoURL: __REPO_URL__
          targetRevision: __TARGET_REVISION__
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
