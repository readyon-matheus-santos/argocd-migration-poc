apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-parent
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: __REPO_URL__
        revision: __TARGET_REVISION__
        files:
          - path: gitops/tenants.yaml
  template:
    metadata:
      name: "tenant-{{ .tenant }}"
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      project: default
      sources:
        - repoURL: __REPO_URL__
          targetRevision: __TARGET_REVISION__
          path: gitops/charts/tenant-parent
          helm:
            # The parent reads the SAME per-service tenant files the children read
            # (harmony shape); each file's content becomes tenantFiles.<svc>.
            fileParameters:
              - name: tenantFiles.backend
                path: $values/gitops/values/_tenants/{{ .tenant }}/backend.yaml
              - name: tenantFiles.subgraph-a
                path: $values/gitops/values/_tenants/{{ .tenant }}/subgraph-a.yaml
              - name: tenantFiles.subgraph-b
                path: $values/gitops/values/_tenants/{{ .tenant }}/subgraph-b.yaml
            values: |
              repoURL: __REPO_URL__
              targetRevision: __TARGET_REVISION__
              tenant: {{ .tenant }}
              namespace: {{ .namespace }}
              childCluster: __CHILD_CLUSTER__
        - repoURL: __REPO_URL__
          targetRevision: __TARGET_REVISION__
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
